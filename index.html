<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Samuel Raj — Waste Spend Governance & Cost Control Specialist</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
  margin: 0;
  font-family: "Segoe UI", Arial, sans-serif;
  background: radial-gradient(circle at top, #4f46e5, #0b102a);
  color: #e5e7eb;
  line-height: 1.65;
}

header {
  background: linear-gradient(rgba(15,23,42,0.85), rgba(15,23,42,0.85)),
  url("https://images.unsplash.com/photo-1581091870627-3a7c40e5d4d1?auto=format&fit=crop&w=1400&q=80");
  background-size: cover;
  background-position: center;
  color: white;
  padding: 110px 20px;
  text-align: center;
}

header h1 { font-size: 44px; margin-bottom: 16px; }
header p { font-size: 19px; max-width: 900px; margin: auto; }

.btn {
  display: inline-block;
  background: linear-gradient(135deg,#22d3ee,#6366f1);
  color: black;
  padding: 14px 32px;
  border-radius: 30px;
  text-decoration: none;
  font-weight: bold;
  margin-top: 30px;
}

section {
  padding: 65px 20px;
  max-width: 1050px;
  margin: auto;
}

.card {
  background: rgba(255,255,255,0.06);
  border-radius: 18px;
  padding: 32px;
  margin-bottom: 28px;
}

input, button {
  width: 100%;
  padding: 14px;
  border-radius: 10px;
  border: none;
  margin-top: 12px;
  font-size: 15px;
}

button {
  background: linear-gradient(135deg,#22d3ee,#6366f1);
  font-weight: bold;
  cursor: pointer;
}

footer {
  background: #020617;
  text-align: center;
  padding: 24px;
}
</style>
</head>

<body>

<header>
<h1>Waste Spend Governance & Cost Behavior Control</h1>
<p>Helping U.S. Property & Finance Teams Eliminate Fake Savings and Stabilize Total Waste Costs</p>
</header>

<section>
<div class="card">
<h2>Upload Invoice For Free Diagnostic</h2>

<form id="uploadForm">
<input type="text" id="name" placeholder="Your Name" required>
<input type="email" id="email" placeholder="Your Email" required>
<input type="text" id="company" placeholder="Company Name">
<input type="file" id="file" required>

<button type="submit">Upload & Request Diagnostic</button>
</form>

<p id="status"></p>
</div>
</section>

<footer>
© 2026 Samuel Raj — Waste Spend Governance Consulting
</footer>

<!-- SUPABASE -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
const supabase = window.supabase.createClient(
"https://yqzsppalopqagksnvhtc.supabase.co",
"sb_publishable_0CylK-Fvj6lA7cfMH-mrpg_rRkdTegt"
);

document.getElementById("uploadForm").addEventListener("submit", async (e) => {
e.preventDefault();

const name = document.getElementById("name").value;
const email = document.getElementById("email").value;
const company = document.getElementById("company").value;
const file = document.getElementById("file").files[0];

const fileName = Date.now() + "-" + file.name;

document.getElementById("status").innerText = "Uploading...";

const { error: uploadError } = await supabase.storage
.from("public-uploads")
.upload(fileName, file);

if(uploadError){
document.getElementById("status").innerText = "Upload failed";
return;
}

await supabase.from("public_leads").insert({
name,
email,
company,
file_path: fileName
});

document.getElementById("status").innerText = "Upload successful — I will contact you soon.";
});
</script>

</body>
</html>
